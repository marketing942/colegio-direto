  <style>
    /* Identidade Colégio CPPEM — mesmos tokens da página de contato */
    :root{
      --white:#fff;
      --blue-400:#5aa2ff;
      --navy-950:#06163a;
      --hero:#061a44;
      --gold:#f2b01e;
      --gold-300:#ffd36b;
      --gold-600:#d99a0b;
      --wa:#25d366;
      --wa-dark:#1da851;
      --font-display:"Nunito",system-ui,sans-serif;
      --font-body:"Nunito Sans",system-ui,sans-serif;
    }

    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{font-family:var(--font-body);color:var(--white);background:var(--hero);line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased}
    img{display:block;max-width:100%}
    a{color:inherit;text-decoration:none}
    :focus-visible{outline:3px solid var(--gold);outline-offset:3px}
    .icon{width:1em;height:1em;flex-shrink:0}

    /* tela única: foto em cima (celular) ou ao fundo (desktop), chamada embaixo */
    .stage{position:relative;isolation:isolate;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;overflow:hidden}
    .stage picture{position:absolute;inset:0 0 auto;height:min(100vw,62svh);z-index:-2}
    .stage picture img{width:100%;height:100%;object-fit:cover;object-position:top}
    .stage::before{content:"";position:absolute;inset:auto 0 0;top:calc(min(100vw,62svh) - 140px);z-index:-1;background:linear-gradient(180deg,transparent,var(--hero) 140px)}

    .top{display:flex;justify-content:center;padding:18px 16px 0}
    .brand{display:flex;align-items:center;gap:10px;padding:6px 16px 6px 6px;border-radius:999px;background:rgb(6 22 58/.6);backdrop-filter:blur(8px);border:1px solid rgb(255 255 255/.14)}
    .brand img{width:40px;height:40px;object-fit:contain}
    .brand span{font-family:var(--font-display);font-weight:900;font-size:15px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
    .brand b{color:var(--gold)}

    .content{margin-top:auto;width:min(520px,100% - 32px);margin-inline:auto;padding:24px 0 calc(28px + env(safe-area-inset-bottom));text-align:center}
    .badge{display:inline-flex;align-items:center;gap:8px;border-radius:999px;border:1px solid rgb(242 176 30/.5);background:rgb(6 26 68/.55);padding:6px 16px;font-family:var(--font-display);font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-300)}
    .badge .dot{position:relative;width:8px;height:8px;border-radius:50%;background:var(--wa);box-shadow:0 0 8px rgb(37 211 102/.9)}
    .badge .dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--wa);animation:ping 1.6s cubic-bezier(0,0,.2,1) infinite}
    h1{margin-top:16px;font-family:var(--font-display);font-weight:900;font-size:clamp(30px,8vw,48px);line-height:1.06;text-shadow:0 2px 16px rgb(0 0 0/.3)}
    h1 span{color:var(--gold-300)}
    .sub{margin:12px auto 0;max-width:420px;font-size:17px;color:rgb(238 245 255/.9)}

    .wa-btn{
      position:relative;
      display:flex;align-items:center;justify-content:center;gap:12px;
      width:100%;margin-top:26px;padding:20px 24px;border-radius:999px;
      font-family:var(--font-display);font-weight:900;font-size:19px;line-height:1.1;
      color:var(--white);background:linear-gradient(180deg,#2fe073,var(--wa) 55%,var(--wa-dark));
      box-shadow:0 0 0 1px rgb(255 255 255/.25) inset,0 16px 36px -10px rgb(37 211 102/.8);
      transition:transform .2s ease,box-shadow .2s ease;
    }
    .wa-btn::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:rgb(37 211 102/.45);animation:pulse 2s cubic-bezier(0,0,.2,1) infinite}
    .wa-btn:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgb(255 255 255/.35) inset,0 20px 40px -10px rgb(37 211 102/.95)}
    .wa-btn .icon{font-size:28px}
    .trust{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;margin-top:16px;font-size:14px;color:rgb(220 235 255/.8)}
    .trust span{display:flex;align-items:center;gap:6px}
    .trust .icon{color:var(--gold);font-size:15px}
    .legal{margin-top:26px;font-size:11.5px;color:rgb(220 235 255/.45)}

    @keyframes ping{75%,100%{transform:scale(2.4);opacity:0}}
    @keyframes pulse{0%{transform:scale(1);opacity:.8}70%,100%{transform:scale(1.12,1.4);opacity:0}}

    @media (min-width:1024px){
      .stage picture{inset:0;height:100%}
      .stage picture img{object-position:left center}
      .stage::before{inset:0;top:0;background:linear-gradient(90deg,rgb(6 26 68/.6),rgb(6 26 68/.15) 45%,transparent)}
      .top{justify-content:flex-start;width:min(1152px,100% - 64px);margin-inline:auto;padding-top:28px}
      .content{margin:auto 0;width:min(1152px,100% - 64px);margin-inline:auto;padding:40px 0;text-align:left}
      .content > *{max-width:480px}
      .sub{margin-left:0}
      .trust{justify-content:flex-start}
    }
    @media (prefers-reduced-motion:reduce){
      .badge .dot::after,.wa-btn::before{animation:none}
    }
  </style>
</head>
